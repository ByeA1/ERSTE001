<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERSTE002 · 3D 预览</title>
<style>
  :root { --bg:#f4f2ee; --ink:#141414; --muted:#8a857e; --accent:#c4291e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:"Helvetica Neue",Arial,"PingFang SC",sans-serif; }
  .wrap { max-width:1440px; margin:0 auto; padding:28px 40px; }
  header { display:flex; justify-content:space-between; border-bottom:1px solid #d9d4cc; padding-bottom:14px;
           font-size:11px; letter-spacing:.18em; text-transform:uppercase; }
  h1 { font-size:clamp(28px,3vw,44px); margin:28px 0 6px; letter-spacing:-.02em; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .stage { background:#fff; border:1px solid #e2ddd5; height:62vh; min-height:420px; border-radius:2px; overflow:hidden; }
  model-viewer { width:100%; height:100%; background:#fff; --poster-color:#fff; }
  .hint { margin-top:12px; font-size:11px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; }
</style>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
<div class="wrap">
  <header><span>Tony Zhang — ERSTE002</span><span>Preview · WIP</span></header>
  <h1>ERSTE002<span style="color:var(--accent)">.</span></h1>
  <div class="sub">拖一下就能转。滚轮缩放，双指也能捏合。</div>
  <div class="stage">
    <model-viewer src="../assets/models/shell-v5.glb"
                  camera-controls auto-rotate auto-rotate-delay="1200"
                  rotation-per-second="18deg" shadow-intensity="0.9"
                  exposure="1.05" environment-image="neutral"
                  camera-orbit="-35deg 72deg 105%" min-field-of-view="18deg">
    </model-viewer>
  </div>
  <div class="hint">Drag to orbit · scroll to zoom</div>
</div>
</body>
</html>
