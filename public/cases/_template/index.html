<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>项目页面接入模板</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:48px 24px;background:#faf9f5;color:#1e211f;font:16px/1.8 system-ui,sans-serif}main{max-width:900px;margin:auto}h1{font-size:clamp(32px,7vw,64px);line-height:1.15}section{margin:64px 0}button,[data-project-close]{display:inline-block;padding:12px 18px;min-height:44px;border:1px solid #777;background:transparent;color:inherit;font:inherit;cursor:pointer}img{max-width:100%;height:auto}[data-rhine-logo]{width:96px;height:45px}[data-rhine-logo] svg{width:100%;height:100%;display:block}
  </style>
</head>
<body>
  <main>
    <!-- The host mounts the shared logo and public services automatically.
         Keep this page content-only; no per-project bootstrap is required. -->
    <div data-rhine-logo aria-hidden="true"></div>
    <nav aria-label="Language"><button data-terminal-language="zh">中</button><button data-terminal-language="en">EN</button></nav>
    <p>PROJECT TEMPLATE / 接入模板</p>
    <h1 data-zh="替换为项目标题" data-en="Your project title">替换为项目标题</h1>
    <p data-zh="这是供后续开发复制的模板，不是已完成的作品案例。" data-en="A content template for new projects, not a finished case study.">这是供后续开发复制的模板，不是已完成的作品案例。</p>
    <a href="/" data-project-close data-zh="返回终端" data-en="Back to terminal">返回终端</a>
    <section id="overview"><h2 data-zh="项目概述" data-en="Overview">项目概述</h2><p data-zh="在此加入真实的项目介绍和资源。" data-en="Add your project content and assets here.">在此加入真实的项目介绍和资源。</p></section>
    <section id="process"><h2 data-zh="设计过程" data-en="Process">设计过程</h2><p data-zh="图片、样式和脚本均使用本站相对路径。" data-en="Use relative same-site paths for images, styles and scripts.">图片、样式和脚本均使用本站相对路径。</p></section>
  </main>
</body>
</html>
