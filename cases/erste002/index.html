<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERSTE002 — 结构讲解</title>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<style>
  :root{ --ink:#E9E5DD; --dim:#7C7873; --red:#C4291E; --line:rgba(233,229,221,.14);
         --mono:"SFMono-Regular",Consolas,Menlo,monospace;
         --sans:"Helvetica Neue",Arial,"PingFang SC",sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0B0B0C;color:var(--ink);font-family:var(--sans)}
  #stage{position:fixed;inset:0;z-index:0}
  canvas{display:block}

  .chrome{position:fixed;inset:0;z-index:2;pointer-events:none;padding:26px 30px;
    display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  .top b{color:var(--ink);font-weight:500}
  .top .ch{color:var(--red)}

  .caption{max-width:min(720px,82vw);position:relative}
  .caption .idx{font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--red);text-transform:uppercase}
  .caption h2{font-size:clamp(26px,4.2vw,50px);max-width:18ch;line-height:1.06;letter-spacing:-.02em;margin:12px 0 14px;font-weight:600}
  .caption p{font-size:14px;line-height:1.85;color:#A9A49C;max-width:56ch}
  .caption::before{content:'';position:absolute;left:-40px;right:-40px;top:-30px;bottom:-30px;background:radial-gradient(120% 120% at 0% 100%, rgba(11,11,12,.92) 0%, rgba(11,11,12,.55) 55%, rgba(11,11,12,0) 100%);z-index:-1}
  .caption[data-on="false"]{opacity:0;transform:translateY(10px)}
  .caption{transition:opacity .45s ease,transform .45s ease}

  #scroller{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain;z-index:1}
  .sections{position:relative}
  .sections section{height:110vh}
  .sections section:last-child{height:120vh}

  .rail{position:fixed;right:26px;top:50%;transform:translateY(-50%);z-index:3;
    display:flex;flex-direction:column;gap:12px}
  .rail i{width:22px;height:1px;background:var(--line);display:block;transition:background .3s,width .3s}
  .rail i.on{background:var(--red);width:34px}

  .hint{position:fixed;right:30px;bottom:22px;z-index:3;font-family:var(--mono);
    font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
</style>
</head>
<body>
<div id="stage"></div>

<div class="chrome">
  <div class="top">
    <span><b>ERSTE002</b> · 结构讲解</span>
    <span class="ch" id="chapter">01 / 05</span>
  </div>

  <div class="caption" id="caption" data-on="true">
    <div class="idx" id="capIdx">01 — OVERVIEW</div>
    <h2 id="capTitle">低矮壳体里的结构重排</h2>
    <p id="capBody">把传感器、PCB 和滚轮压进同一段垂直空间——先看整体比例，再逐件拆开。</p>
  </div>
</div>

<div class="rail" id="rail"></div>
<div class="hint">向下滚动 · 镜头与灯光跟着走</div>

<div id="scroller"><div class="sections">
  <section></section><section></section><section></section><section></section><section></section>
</div></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const host = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0B0B0C');
scene.fog = new THREE.FogExp2('#0B0B0C', 0.06);

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 20);

const key = new THREE.DirectionalLight('#FFF6EA', 2.1);
key.position.set(-0.5, 0.9, 0.65);
scene.add(key);
const rim = new THREE.DirectionalLight('#C4291E', 0.8);
rim.position.set(0.85, 0.35, -0.8);
scene.add(rim);
scene.add(new THREE.HemisphereLight('#F2EEE6', '#07070A', 0.3));

const spot = new THREE.SpotLight('#FFF1E2', 0, 0.9, 0.45, 0.6, 1.2);
scene.add(spot);
scene.add(spot.target);

const root = new THREE.Group();
scene.add(root);
const parts = new Map();
let unitScale = 1;

const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('./vendor/draco/');
loader.setDRACOLoader(draco);

loader.load('./assets/shell-hi.glb', (gltf) => {
  const model = gltf.scene;
  const raw = new THREE.Box3().setFromObject(model);
  const size = raw.getSize(new THREE.Vector3());
  unitScale = 0.30 / Math.max(size.x, size.y, size.z);
  model.scale.setScalar(unitScale);
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model);
  model.position.sub(box.getCenter(new THREE.Vector3()));
  model.traverse((o) => {
    if (o.isMesh) {
      o.material = new THREE.MeshPhysicalMaterial({
        color: '#26262A', metalness: 0.14, roughness: 0.36,
        clearcoat: 0.25, clearcoatRoughness: 0.3, envMapIntensity: 0.7,
      });
      parts.set(o.name, o);
    }
  });
  root.add(model);
  apply(progress());
}, undefined, (e) => console.error('glb', e));

/* ---------- storyboard ---------- */
const LIFT = { bottom_plate: -0.034, shell_top: 0.026, button_cover: 0.058 };

const chapters = [
  { idx: '01 — OVERVIEW', title: '低矮壳体里的结构重排',
    body: '把传感器、PCB 和滚轮压进同一段垂直空间——先看整体比例，再逐件拆开。',
    cam: { p: [0.34, 0.24, 0.72], t: [0, 0.01, 0], fov: 30 }, part: null, spot: 0 },

  { idx: '02 — SENSOR', title: '光心对准指尖的捏合轴',
    body: '传感器孔 Ø11，开在中线偏前；灯只照这一块，其他结构退进暗部。',
    cam: { p: [0.12, 0.16, 0.60], t: [0, 0.03, 0.03], fov: 27 }, part: 'bottom_plate', spot: 2.4 },

  { idx: '03 — SWITCH', title: '开关槽留在尾段右侧',
    body: '拇指自然落点，槽口向内收 1.2mm，避免误触。',
    cam: { p: [0.34, 0.18, -0.56], t: [0, 0.02, -0.02], fov: 28 }, part: 'bottom_plate', spot: 2.2 },

  { idx: '04 — BUTTONS', title: '按键盖与上盖分缝 0.8mm',
    body: '留出行程与回弹空间，同时保持侧壁连续。',
    cam: { p: [0.32, 0.34, 0.62], t: [0, 0.03, 0.02], fov: 28 }, part: 'button_cover', spot: 2.6 },

  { idx: '05 — ASSEMBLY', title: '三件、1.6mm 底板、两层叠合',
    body: '装配顺序即拆解顺序：底板先落，上盖合上，按键盖最后压入。',
    cam: { p: [0.52, 0.34, 0.86], t: [0, 0.01, 0], fov: 32 }, part: null, spot: 0, explode: 1, boost: 1.5 },
];

const rail = document.getElementById('rail');
chapters.forEach(() => rail.appendChild(document.createElement('i')));
const dots = [...rail.children];

const capIdx = document.getElementById('capIdx');
const capTitle = document.getElementById('capTitle');
const capBody = document.getElementById('capBody');
const caption = document.getElementById('caption');
const chapterTag = document.getElementById('chapter');

let camPos = new THREE.Vector3(...chapters[0].cam.p);
let camTarget = new THREE.Vector3(...chapters[0].cam.t);
let fov = chapters[0].cam.fov;
let activeIndex = -1;

const scroller = document.getElementById('scroller');
function progress() {
  const max = scroller.scrollHeight - scroller.clientHeight;
  return max > 0 ? Math.min(1, Math.max(0, scroller.scrollTop / max)) : 0;
}

const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);

function apply(p) {
  const x = p * (chapters.length - 1);
  const i = Math.min(chapters.length - 2, Math.floor(x));
  const f = ease(x - i);
  const a = chapters[i], b = chapters[i + 1];

  const lerp3 = (u, v) => [
    u[0] + (v[0] - u[0]) * f,
    u[1] + (v[1] - u[1]) * f,
    u[2] + (v[2] - u[2]) * f,
  ];

  const pos = lerp3(a.cam.p, b.cam.p);
  const tgt = lerp3(a.cam.t, b.cam.t);
  camPos.set(...pos);
  camTarget.set(...tgt);
  fov = a.cam.fov + (b.cam.fov - a.cam.fov) * f;

  // explode only grows towards the last chapter
  const ex = (a.explode ?? 0) + ((b.explode ?? 0) - (a.explode ?? 0)) * f;
  parts.forEach((obj, name) => {
    obj.position.y = ((LIFT[name] ?? 0) / unitScale) * ex;
  });

  // spotlight follows whichever part the current chapter focuses
  const partName = f < 0.5 ? a.part : b.part;
  const spotI = (a.spot ?? 0) + ((b.spot ?? 0) - (a.spot ?? 0)) * f;
  if (partName && parts.has(partName)) {
    const box = new THREE.Box3().setFromObject(parts.get(partName));
    const c = box.getCenter(new THREE.Vector3());
    spot.target.position.copy(c);
    spot.position.set(c.x + 0.10, c.y + 0.22, c.z + 0.16);
  }
  spot.intensity = spotI;
  const boost = (a.boost ?? 1) + ((b.boost ?? 1) - (a.boost ?? 1)) * f;
  key.intensity = (2.1 - 1.0 * Math.min(1, spotI / 2.4)) * boost;
  rim.intensity = 0.8 - 0.4 * Math.min(1, spotI / 2.4);

  const idx = Math.round(x);
  if (idx !== activeIndex) {
    activeIndex = idx;
    const c = chapters[idx];
    capIdx.textContent = c.idx;
    capTitle.textContent = c.title;
    capBody.textContent = c.body;
    chapterTag.textContent = `${String(idx + 1).padStart(2, '0')} / 0${chapters.length}`;
    dots.forEach((d, n) => d.classList.toggle('on', n === idx));
    caption.dataset.on = 'true';
  }
}

/* ---------- loop ---------- */
let smoothed = 0;
function tick() {
  requestAnimationFrame(tick);
  const target = progress();
  smoothed += (target - smoothed) * 0.12;
  apply(smoothed);

  camera.position.lerp(camPos, 0.16);
  camera.fov += (fov - camera.fov) * 0.16;
  camera.updateProjectionMatrix();
  camera.lookAt(camTarget);

  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
